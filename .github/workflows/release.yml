# Release to npm via Trusted Publishing (OIDC) — no token, no OTP.
#
# Why this exists: the npm account has `two-factor auth: auth-and-writes`, so a
# laptop `npm publish` demands a fresh authenticator code every time, and npm is
# separately restricting the long-lived tokens that used to bypass that. Trusted
# Publishing removes both problems: GitHub mints a short-lived OIDC token for
# this exact workflow, npm verifies it against the trusted publisher configured
# on the package, and the published version carries provenance automatically.
#
# ONE-TIME SETUP on npmjs.com, before the first run:
#   Package -> Settings -> Trusted Publisher -> GitHub Actions, with
#     Organization or user:  estmcmxci
#     Repository:            mm-plugin-ensv2
#     Workflow filename:     release.yml
#     Environment:           (leave blank — this workflow declares none)
#   The values must match exactly or npm rejects the OIDC token.
#
# To release: bump the version in package.json, commit, then push a matching
# tag — `git tag v0.9.0 && git push origin v0.9.0`. The tag must equal the
# manifest version; the guard below refuses the run otherwise, so a mistyped
# tag fails before anything reaches the registry. `workflow_dispatch` runs the
# same path for the version already on the default branch.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for Trusted Publishing: lets the job mint the OIDC token npm
      # exchanges for short-lived publish rights. Without it npm falls back to
      # looking for a token and fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10.x, which has no OIDC support. Trusted Publishing
      # needs npm >= 11.5.1, so upgrade before anything calls publish.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm install --no-fund --no-audit

      # The published artifact is built by `prepack`, but run the suite first so
      # a release can never ship code the tests reject.
      - name: Test
        run: npm test

      - name: Refuse a tag that disagrees with the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi
          echo "releasing $manifest"

      - name: Refuse to republish a version already on the registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published — bump the version"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: the OIDC exchange is what authorises this, and
      # provenance is attached automatically on a trusted-publisher run.
      - name: Publish
        run: npm publish
